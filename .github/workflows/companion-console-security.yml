name: companion-console-security

on:
  push:
    paths:
      - "handoff/companion_web.py"
      - "handoff/tests/test_console_security.py"
      - "handoff/tests/test_unpair.py"
      - ".github/workflows/companion-console-security.yml"
  pull_request:
    paths:
      - "handoff/companion_web.py"
      - "handoff/tests/test_console_security.py"
      - "handoff/tests/test_unpair.py"
      - ".github/workflows/companion-console-security.yml"

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test prerequisites
        run: python -m pip install pytest "PyNaCl>=1.5" "zeroconf>=0.130"
      - name: Run actual loopback HTTP regressions and existing unpair tests
        run: python -m pytest -q handoff/tests/test_console_security.py handoff/tests/test_unpair.py
